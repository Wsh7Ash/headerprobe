[build-system]
requires=["setuptools>=61.0"]
build-backend="setuptools.build_meta"
[project]
name="headerprobe"
version="0.1.0"
description="Auth-related response header inspector"
readme="README.md"
requires-python=">=3.10"
dependencies=["click>=8.1.0","requests>=2.31.0","rich>=13.0.0"]
[project.scripts]
headerprobe="headerprobe.cli:main"
[tool.setuptools.packages.find]
where=["src"]
